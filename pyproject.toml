[project]
name = "mi-proyecto-mlops"
version = "0.1.0"
description = ""
authors = [
    {name = "Jose Figueroa - Emmanuel Marin - Juan Rodriguez"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "prefect (==3.8.8)",
    "mlflow (==3.17.0)",
    "scikit-learn (==1.9.1)",
    "pandas (==3.0.6)",
    "numpy (==2.5.4)",
    "pyyaml (==6.0.3)",
    "evidently (==0.7.23)",
    "scipy (==1.18.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==9.1.1)",
    "httpx (==0.28.1)"
]
[tool.poetry]
package-mode = false
