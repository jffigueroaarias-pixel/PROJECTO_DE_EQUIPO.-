# Ajustes para ejecutar los servicios dentro de GitHub Codespaces.
# Uso: docker compose -f docker-compose.yml -f docker-compose.codespaces.yml up -d
services:
  prefect-server:
    environment:
      PREFECT_UI_API_URL: "https://${CODESPACE_NAME}-4200.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}/api"
  mlflow:
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow_store/mlflow.db
      --artifacts-destination /mlflow_store/artifacts
      --serve-artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*,*.app.github.dev"
